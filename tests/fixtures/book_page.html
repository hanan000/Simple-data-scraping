<!DOCTYPE html>
<!-- Reduced book page for "Arachnoid Mater" (values match the 2020 scrape).
     It keeps only the element nesting the parser relies on: the rating
     widget at the positional XPath in scraper.RATING_XPATH, and the
     labelled "İlk Baskı Yılı:" / "Sayfa Sayısı:" product attributes. -->
<html lang="tr">
<head><meta charset="utf-8"><title>Arachnoid Mater | idefix</title></head>
<body>
<div id="wrapper">
  <section>
    <div>
      <div class="breadcrumb">Anasayfa &gt; Kitap &gt; Bilim &gt; Popüler Bilim</div>
      <div>
        <section class="product-gallery"></section>
        <section class="product-detail">
          <div>
            <div>
              <div>
                <div class="product-image"></div>
                <div class="product-title"><h1>Arachnoid Mater</h1></div>
                <div class="product-info">
                  <div class="rating-area"></div>
                  <div class="rating-summary">
                    <div>
                      <div class="stars"></div>
                      <div class="rating-text">
                        <span><span>3,5</span>/<span>5</span> - <span>19</span> Kişi</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="product-attributes">
            <ul>
              <li><span>Yayınevi:</span> <a class="bold" href="#">Elma Yayınevi</a></li>
              <li><span>İlk Baskı Yılı:</span> <a class="bold" href="#">2020</a></li>
              <li><span>Sayfa Sayısı:</span> <a class="bold" href="#">488</a></li>
              <li><span>Dil:</span> <a class="bold" href="#">Türkçe</a></li>
            </ul>
          </div>
        </section>
      </div>
    </div>
  </section>
</div>
</body>
</html>
